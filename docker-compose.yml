services:
  web:
    build: .
    restart: unless-stopped
    environment:
      - SESSION_SECRET=${SESSION_SECRET}
      - SIGNUP=${SIGNUP:-open}
      - SIGNUP_CODE=${SIGNUP_CODE:-}
    volumes:
      - harising-data:/data
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  harising-data:
